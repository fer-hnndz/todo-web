services:
  db:
    image: postgres:18.0
    env_file:
      - .db.env
    volumes:
      - db_data:/var/lib/postgresql

  webapp:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - db

  todo_nginx_proxy:
    image: nginx:1.28.1-alpine
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - webapp

  pgadmin:
    image: elestio/pgadmin:REL-9_8
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
volumes:
  db_data:
  pgadmin_data:
